<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <title>⚔️ Medieval Bingo ⚔️</title>
    <style>
        :root {
            --gap: 5px;
            --radius: 14px;
            --shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                system-ui,
                -apple-system,
                Segoe UI,
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            background: #29304e;
            color: #111;
        }

        .topbar {
            background: #b22222;
            padding: 14px 14px 10px;
            border-bottom: 2px dashed #f3efe3;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .medievalsharp-regular {
            font-family: "MedievalSharp", cursive;
            font-weight: 400;
            font-style: normal;
        }

        .unifrakturmaguntia-regular {
            font-family: "UnifrakturMaguntia", cursive;
            font-weight: 400;
            font-style: normal;
        }



        .logo {
            display: block;
            height: auto;
            margin-bottom: 5px;
            padding-bottom: 0;
        }

        h1 {
            font-family: "UnifrakturMaguntia", cursive;
            font-size: 22px;
            margin: 0 0 10px;
            text-align: center;
            letter-spacing: 1px;
            color: #f3efe3;
        }

        .actions {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 10px;
            max-width: 820px;
        }

        button {
            padding: 10px 12px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 12px;
            box-shadow: var(--shadow);
            font-weight: 700;

            color: #111;
            /* stop iOS blue */
            -webkit-text-fill-color: #111;
            /* stop iOS blue */
            -webkit-appearance: none;
            appearance: none;
        }

        button:active {
            transform: translateY(1px);
        }

        .status {
            margin: 0;
            font-size: 13px;
            color: #444;
            display: none;
            /* turn on if you want */
        }

        main {
            padding: 14px;
            max-width: 820px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: var(--gap);
        }

        .square {
            user-select: none;
            padding: 5px;
            border-radius: var(--radius);
            border: 1px solid #e7e7e7;
            background: #fff;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.2;
            font-weight: 650;
            font-size: 14px;
            aspect-ratio: 1 / 1;
            transition:
                transform 0.12s ease,
                background 0.2s ease,
                color 0.2s ease;
        }

        .square.checked {

            background: #2a444d;
            color: #fff;
            -webkit-text-fill-color: #fff;
            /* iOS */
        }

        /* Squares that are part of a completed line */
        .square.checked.linewin {
            background: #692751;
            color: #fff;
            -webkit-text-fill-color: #fff;
            border-color: #fff;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid #ddd;
            background: #fff;
            box-shadow: var(--shadow);
            font-weight: 800;
            font-size: 13px;
        }

        .footer {
            padding: 14px;
            text-align: center;
            color: #000;
            border-top: 2px dashed #692751;
        }

        /* --- Bingo overlay --- */
        .overlay[hidden] {
            display: none;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            display: grid;
            place-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .overlay-card {
            width: min(420px, 92vw);
            background: white;
            border-radius: 18px;
            padding: 18px 16px;
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.25);
            text-align: center;
            position: relative;
        }

        .overlay-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .overlay-sub {
            font-size: 14px;
            opacity: 0.75;
            margin-bottom: 12px;
        }

        .overlay-actions {
            display: flex;
            justify-content: center;
        }

        /* --- Confetti (CSS only) --- */
        .confetti {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .confetti i {
            position: absolute;
            top: -12px;
            width: 10px;
            height: 14px;
            opacity: 0.95;
            transform: rotate(10deg);
            animation: fall 1100ms linear forwards;
            border-radius: 3px;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <h1 class="medievalsharp-regular">⚔️ Medieval Bingo ⚔️</h1>
        <div class="actions">
            <button id="newBoardBtn" type="button">Reshuffle</button>
            <button id="resetTicksBtn" type="button">Clear</button>
        </div>

        <p class="status" id="status"></p>
    </header>

    <main>
        <section class="grid" id="grid" aria-label="Bingo grid"></section>
    </main>
    <footer class="footer">
        <small>Slay the dragon! 🐉</small>
    </footer>

    <div id="bingoOverlay" class="overlay" hidden>
        <div class="overlay-card">
            <div class="overlay-title">BINGO! 🎉</div>
            <div class="overlay-sub">ur prize is a hangover</div>
            <div class="overlay-actions">
                <button id="closeOverlayBtn" type="button">Congrats 🥂</button>
            </div>
        </div>
        <div id="confetti" class="confetti" aria-hidden="true"></div>
    </div>

    <script>
        const SHEET_CSV_URL =
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vR2muqzKU8cFQB-Q7as50agwf8qrlQZ_b-Z6F2gEtcjWqoiOw1GjeWMGSGahu7TJ1ec6vlyyDXp3zJP/pub?output=csv";
        const GRID_DIM = 4;
        const GRID_SIZE = GRID_DIM * GRID_DIM;
        const IDEAS_NEEDED = GRID_SIZE;

        const STORE_KEY = "wedding-bingo-v1-state";
        const WINS_KEY = "wedding-bingo-v1-wins";

        function $(id) { return document.getElementById(id); }
        function setStatus(msg) { const el = $("status"); if (el) el.textContent = msg; }

        function loadState() {
            try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; }
            catch { return null; }
        }
        function saveState(state) { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

        function loadWins() {
            try { return Number(localStorage.getItem(WINS_KEY) || "0"); }
            catch { return 0; }
        }
        function saveWins(wins) { localStorage.setItem(WINS_KEY, String(wins)); }

        function randomInt(min, maxExclusive) {
            const range = maxExclusive - min;
            if (range <= 0) return min;
            if (crypto?.getRandomValues) {
                const maxUint = 0xffffffff;
                const limit = maxUint - (maxUint % range);
                const buf = new Uint32Array(1);
                while (true) {
                    crypto.getRandomValues(buf);
                    const x = buf[0];
                    if (x < limit) return min + (x % range);
                }
            }
            return min + Math.floor(Math.random() * range);
        }

        function shuffleInPlace(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = randomInt(0, i + 1);
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function parseCSVToRows(text) {
            const rows = [];
            let row = [], field = "", inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i], next = text[i + 1];
                if (inQuotes) {
                    if (c === '"' && next === '"') { field += '"'; i++; }
                    else if (c === '"') inQuotes = false;
                    else field += c;
                } else {
                    if (c === '"') inQuotes = true;
                    else if (c === ',') { row.push(field); field = ""; }
                    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
                    else if (c === '\r') { /* ignore */ }
                    else field += c;
                }
            }
            row.push(field);
            rows.push(row);
            return rows;
        }

        function extractIdeasFromCSV(text) {
            const rows = parseCSVToRows(text);
            const items = rows.map(r => (r[0] ?? "").trim()).filter(Boolean);
            if (items.length && /day|wedding|bingo/i.test(items[0])) items.shift();
            return items;
        }

        function makeNewBoardFromOptions(items) {
            const pool = [...items];
            shuffleInPlace(pool);
            return {
                createdAt: new Date().toISOString(),
                board: pool.slice(0, GRID_SIZE),
                checked: Array(GRID_SIZE).fill(false),
                celebratedFull: false,
            };
        }

        function isFullGrid(checked) { return checked.every(Boolean); }

        function getWinLines() {
            const lines = [];
            for (let r = 0; r < GRID_DIM; r++) {
                const line = [];
                for (let c = 0; c < GRID_DIM; c++) line.push(r * GRID_DIM + c);
                lines.push(line);
            }
            for (let c = 0; c < GRID_DIM; c++) {
                const line = [];
                for (let r = 0; r < GRID_DIM; r++) line.push(r * GRID_DIM + c);
                lines.push(line);
            }
            lines.push([0, 5, 10, 15]);
            lines.push([3, 6, 9, 12]);
            return lines;
        }

        const WIN_LINES = getWinLines();

        function getLineWinSet(checked) {
            const winners = new Set();
            for (const line of WIN_LINES) {
                if (line.every(i => checked[i])) line.forEach(i => winners.add(i));
            }
            return winners;
        }

        function vibrate(ms = 40) { try { navigator.vibrate?.(ms); } catch { } }

        let audioCtx = null;
        function playWinSound() {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = "sine";
                o.frequency.value = 740;
                g.gain.value = 0.0001;
                o.connect(g);
                g.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                g.gain.setValueAtTime(0.0001, now);
                g.gain.exponentialRampToValueAtTime(0.2, now + 0.01);
                g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
                o.start(now);
                o.stop(now + 0.2);
            } catch { }
        }

        function burstConfetti() {
            const confetti = $("confetti");
            if (!confetti) return;
            confetti.innerHTML = "";
            for (let i = 0; i < 40; i++) {
                const p = document.createElement("i");
                p.style.left = `${randomInt(0, 100)}vw`;
                p.style.animationDelay = `${randomInt(0, 250)}ms`;
                p.style.animationDuration = `${randomInt(900, 1400)}ms`;
                p.style.width = `${randomInt(6, 12)}px`;
                p.style.height = `${randomInt(10, 18)}px`;
                const palette = ["#111", "#ff3b30", "#ffcc00", "#34c759", "#0a84ff", "#bf5af2"];
                p.style.background = palette[randomInt(0, palette.length)];
                p.style.transform = `rotate(${randomInt(0, 360)}deg)`;
                p.style.borderRadius = "3px";
                p.style.position = "absolute";
                p.style.top = "-12px";
                p.style.opacity = "0.95";
                p.style.animation = `fall ${randomInt(900, 1400)}ms linear forwards`;
                confetti.appendChild(p);
            }
            setTimeout(() => { confetti.innerHTML = ""; }, 1600);
        }

        function showBingoOverlay() {
            const overlay = $("bingoOverlay");
            if (!overlay) return;
            overlay.hidden = false;
            burstConfetti();
        }

        function hideBingoOverlay() {
            const overlay = $("bingoOverlay");
            if (!overlay) return;
            overlay.hidden = true;
        }

        function ensureWinsBadge() {
            const statusEl = $("status");
            if (statusEl && !$("winsBadge")) {
                const badge = document.createElement("span");
                badge.id = "winsBadge";
                badge.className = "badge";
                badge.style.marginLeft = "10px";
                badge.textContent = `Wins: ${loadWins()}`;
                statusEl.appendChild(badge);
            }
        }

        function updateWinBadge() {
            const el = $("winsBadge");
            if (el) el.textContent = `Wins: ${loadWins()}`;
        }

        let options = [];
        let state = null;

        async function fetchOptions() {
            const res = await fetch(SHEET_CSV_URL);
            if (!res.ok) throw new Error(`Fetch failed: ${res.status}`);
            const text = await res.text();
            const items = extractIdeasFromCSV(text);
            if (items.length < IDEAS_NEEDED) {
                throw new Error(`Need at least ${IDEAS_NEEDED} ideas (found ${items.length}).`);
            }
            return items;
        }

        function renderBoard() {
            const grid = $("grid");
            if (!grid || !state) return;
            grid.innerHTML = "";
            const lineWins = getLineWinSet(state.checked);

            state.board.forEach((text, idx) => {
                const btn = document.createElement("button");
                btn.type = "button";
                const isChecked = !!state.checked[idx];
                const isLineWin = lineWins.has(idx);
                btn.className = "square" + (isChecked ? " checked" : "") + (isLineWin ? " linewin" : "");
                btn.textContent = text;

                btn.addEventListener("click", () => {
                    state.checked[idx] = !state.checked[idx];
                    const full = isFullGrid(state.checked);
                    if (full && !state.celebratedFull) {
                        state.celebratedFull = true;
                        const wins = loadWins() + 1;
                        saveWins(wins);
                        updateWinBadge();
                        vibrate(80);
                        playWinSound();
                        showBingoOverlay();
                    }
                    if (!full && state.celebratedFull) state.celebratedFull = false;
                    saveState(state);
                    renderBoard();
                });

                grid.appendChild(btn);
            });

            updateWinBadge();
        }

        function wireUI() {
            $("newBoardBtn")?.addEventListener("click", () => {
                if (!options?.length) { setStatus("Squares not loaded yet."); return; }
                state = makeNewBoardFromOptions(options);
                saveState(state);
                renderBoard();
            });

            $("resetTicksBtn")?.addEventListener("click", () => {
                if (!state) return;
                state.checked = Array(GRID_SIZE).fill(false);
                state.celebratedFull = false;
                saveState(state);
                renderBoard();
            });

            $("closeOverlayBtn")?.addEventListener("click", hideBingoOverlay);

            $("bingoOverlay")?.addEventListener("click", (e) => {
                if (e.target?.id === "bingoOverlay") hideBingoOverlay();
            });
        }

        (async function init() {
            wireUI();
            ensureWinsBadge();
            state = loadState();

            try {
                setStatus("Loading squares…");
                options = await fetchOptions();
                if (!state) {
                    state = makeNewBoardFromOptions(options);
                    saveState(state);
                } else {
                    if (typeof state.celebratedFull !== "boolean") state.celebratedFull = false;
                }
            } catch (e) {
                console.error(e);
                setStatus("Couldn't load squares. Check your connection.");
                return;
            }

            renderBoard();
        })();
    </script>
</body>

</html>
